[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
# Ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. Excluded per
# code-standards ADR-0009: the affected population is ADRs and historical plan
# documents, i.e. the record, and rewriting them buys nothing.
extend-exclude = ["*.md"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["C90", "E501"]
"src/brains/app/repositories/**" = ["C90", "E501"]
"src/brains/app/services/**" = ["E501"]
"src/brains/app/tools/**" = ["C90", "E501"]
"src/brains/infra/migrations/**" = ["E501"]
"src/brains/infra/repositories/**" = ["E501"]
"src/brains/infra/seed.py" = ["C90", "E501", "E741"]
"src/brains/infra/tools/**" = ["C90", "E501", "E741"]
"src/brains/open/repositories/**" = ["E501"]
"src/brains/open/tools/**" = ["C90", "E501"]
"tests/**" = ["B", "C90", "E402", "E501"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "**/alembic",
  "**/migrations",
  "tests",
  "scripts",
]
# SQLAlchemy's async Result/ARRAY stubs and FastMCP's dynamic module protocol
# produce false positives for these categories; runtime behavior is covered by
# the integration suite. Other basic-mode diagnostics remain enabled.
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"
