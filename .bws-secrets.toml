# .bws-secrets.toml — BWS secret UUIDs this repo consumes (NEVER token values).
# Stable UUIDs only; resolved at runtime from BWS_ACCESS_TOKEN.
# Real UUIDs are filled at cutover (Task 17) once BWS secrets are created.
# Schema: [[secret]] entries per security-standards manifest.py — uuid is required.

# ── infra-brain ──────────────────────────────────────────────────────────────

# 64-hex MCP access key for the infra-brain deployment
[[secret]]
uuid = "00000000-0000-0000-0001-000000000001"  # filled at cutover
name = "INFRA_BRAIN_MCP_ACCESS_KEY"
project = "brain"

# Postgres password for infra-brain's managed database
[[secret]]
uuid = "00000000-0000-0000-0001-000000000002"  # filled at cutover
name = "INFRA_BRAIN_POSTGRES_PASSWORD"
project = "brain"

