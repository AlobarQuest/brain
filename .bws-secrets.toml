# .bws-secrets.toml — BWS secret UUIDs this repo consumes (NEVER token values).
# Stable UUIDs only. End-state (WS-0.1, 2026-07-02): BWS is the source of truth;
# values are injected as Coolify env vars at deploy time (change-manager pattern).
# The app does NOT fetch from BWS at runtime — this manifest declares which BWS
# secrets hold the authoritative values for the env each deployment consumes.
# Schema: [[secret]] entries per security-standards manifest.py — uuid is required.
# Project: `brains` (0b81ad03-8628-4095-a7d5-b47b0136932e). Some pre-existing
# secrets still live in their original BWS project pending an optional console
# move (UUID is unchanged by project moves, so entries here stay valid).
consumption = "coolify-env"

# ── infra-brain ──────────────────────────────────────────────────────────────

# 64-hex MCP access key for the infra-brain deployment (env MCP_ACCESS_KEY)
[[secret]]
uuid = "769eabbf-f1dd-4668-a303-b42300e44626"
name = "INFRA_BRAIN_MCP_ACCESS_KEY"
project = "brains"

# Postgres password for infra-brain's managed database
[[secret]]
uuid = "58416a40-d043-4393-aada-b47b013804f3"
name = "INFRA_BRAIN_POSTGRES_PASSWORD"
project = "brains"

# ── open-brain ───────────────────────────────────────────────────────────────

# 64-hex MCP access key for the open-brain deployment (env MCP_ACCESS_KEY)
[[secret]]
uuid = "1d23025c-a709-4a85-81b6-b47b0138047a"
name = "OPEN_BRAIN_MCP_ACCESS_KEY"
project = "brains"

# Postgres password for open-brain's managed database
[[secret]]
uuid = "782a6af6-1e7d-4ae3-a87b-b47b01380574"
name = "OPEN_BRAIN_POSTGRES_PASSWORD"
project = "brains"

# ── app-brain ────────────────────────────────────────────────────────────────

# 64-hex MCP access key for the app-brain deployment (env MCP_ACCESS_KEY).
# Same UUID is read by infraops drift-audit (BWS_APPBRAIN_SECRET_ID default) —
# do not delete/re-key without updating that consumer.
[[secret]]
uuid = "68733abe-682a-4597-b88f-b4750189a56a"
name = "APP_BRAIN_MCP_ACCESS_KEY"
project = "brains"

# Postgres password for app-brain's managed database
[[secret]]
